<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="description" content="A.A Fashion — considered everyday pieces, curated in Lahore.">
  <title>A.A Fashion — Quietly bold essentials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f4ee;
      --paper-2: #efebe2;
      --ink: #151616;
      --muted: #6b6c66;
      --line: #dedbd2;
      --olive: #606b4e;
      --olive-dark: #3f4a31;
      --sage: #dce3d2;
      --rust: #c86e4c;
      --white: #fffefa;
      --shadow: 0 22px 60px rgba(24, 29, 20, .10);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 11px;
      --sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Playfair Display", Georgia, serif;
      color-scheme: light;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; overflow-x: hidden; }
    body.modal-open { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    ::selection { background: var(--olive); color: var(--white); }

    .app-shell { min-height: 100vh; }
    .top-strip { background: var(--ink); color: #f8f5ed; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; text-align: center; padding: 9px 16px; }
    .site-header { position: sticky; z-index: 20; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 28px; padding: 18px clamp(18px, 5vw, 74px); background: rgba(247, 244, 238, .88); border-bottom: 1px solid rgba(222, 219, 210, .7); backdrop-filter: blur(18px); }
    .brand { display: inline-flex; align-items: center; gap: 11px; flex-shrink: 0; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--ink); border-radius: 50%; font-family: var(--serif); font-size: 13px; line-height: 1; letter-spacing: -.12em; padding-right: 3px; }
    .brand-copy { display: grid; gap: 0; }
    .brand-name { font-family: var(--serif); font-size: 20px; letter-spacing: -.04em; line-height: 1; }
    .brand-meta { color: var(--muted); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; margin-top: 3px; }
    .main-nav { display: flex; align-items: center; gap: clamp(17px, 3vw, 36px); color: var(--muted); font-size: 13px; font-weight: 600; }
    .main-nav a { position: relative; padding: 6px 0; transition: color .2s ease; }
    .main-nav a:hover, .main-nav a.active { color: var(--ink); }
    .main-nav a.active::after { position: absolute; content: ""; height: 2px; background: var(--olive); left: 0; right: 0; bottom: 0; border-radius: 2px; }
    .header-actions { display: flex; align-items: center; gap: 9px; }
    .icon-button, .cart-button { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 40px; padding: 0 10px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; transition: .2s ease; }
    .icon-button:hover, .cart-button:hover { border-color: var(--ink); transform: translateY(-1px); }
    .cart-button { gap: 7px; padding: 0 13px; font-size: 12px; font-weight: 700; }
    .cart-count { display: grid; place-items: center; min-width: 19px; height: 19px; padding: 0 4px; background: var(--olive); color: var(--white); border-radius: 50%; font-size: 10px; }
    .mobile-menu { display: none; }

    .page { width: min(1440px, 100%); margin: 0 auto; padding: 0 clamp(18px, 5vw, 74px) 100px; }
    .hero { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(420px, .98fr); gap: clamp(36px, 8vw, 132px); align-items: center; min-height: min(730px, calc(100vh - 100px)); padding: clamp(54px, 9vw, 118px) 0 clamp(64px, 9vw, 110px); }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--olive-dark); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }
    .hero h1 { max-width: 740px; margin: 24px 0 22px; font-family: var(--serif); font-size: clamp(52px, 7.3vw, 105px); font-weight: 500; letter-spacing: -.075em; line-height: .94; }
    .hero h1 em { color: var(--olive); font-style: normal; }
    .hero-copy { max-width: 470px; color: var(--muted); font-size: clamp(15px, 1.5vw, 18px); line-height: 1.7; }
    .hero-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 32px; }
    .primary-button, .secondary-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 21px; border-radius: 999px; font-size: 13px; font-weight: 700; transition: .25s ease; }
    .primary-button { background: var(--ink); color: var(--white); }
    .primary-button:hover { background: var(--olive-dark); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(21, 22, 22, .16); }
    .secondary-button { background: transparent; border: 1px solid var(--line); color: var(--ink); }
    .secondary-button:hover { border-color: var(--ink); transform: translateY(-2px); }
    .hero-note { display: flex; gap: 10px; align-items: center; margin-top: 42px; color: var(--muted); font-size: 12px; }
    .hero-note strong { color: var(--ink); }
    .mini-avatars { display: flex; padding-left: 7px; }
    .mini-avatars span { width: 25px; height: 25px; margin-left: -7px; border: 2px solid var(--paper); border-radius: 50%; background-size: cover; background-position: center; }
    .mini-avatars span:nth-child(1) { background-image: url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=100&q=80'); }
    .mini-avatars span:nth-child(2) { background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80'); }
    .mini-avatars span:nth-child(3) { background-image: url('https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?auto=format&fit=crop&w=100&q=80'); }

    .hero-art { position: relative; min-height: 550px; }
    .hero-art::before { position: absolute; content: ""; width: 73%; aspect-ratio: 1; left: 17%; top: 8%; background: var(--sage); border-radius: 48% 52% 54% 46% / 46% 43% 57% 54%; transform: rotate(12deg); }
    .hero-image-main, .hero-image-small { position: absolute; overflow: hidden; box-shadow: var(--shadow); }
    .hero-image-main { width: min(76%, 430px); aspect-ratio: .72; right: 4%; top: 3%; border-radius: 45% 45% 8px 8px; transform: rotate(3deg); }
    .hero-image-main img, .hero-image-small img { width: 100%; height: 100%; object-fit: cover; }
    .hero-image-main img { object-position: center top; }
    .hero-image-small { width: 41%; aspect-ratio: .9; left: 4%; bottom: 2%; border: 12px solid var(--paper); border-radius: 8px 8px 42% 42%; transform: rotate(-8deg); }
    .hero-image-small img { object-position: center; }
    .art-label { position: absolute; right: -3%; bottom: 12%; display: flex; align-items: center; gap: 10px; padding: 12px 15px; background: var(--white); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 12px 35px rgba(24, 29, 20, .08); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; transform: rotate(-8deg); }
    .art-label b { display: grid; place-items: center; width: 26px; height: 26px; background: var(--rust); color: var(--white); border-radius: 50%; font-family: var(--serif); font-size: 14px; }

    .stat-line { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .stat { padding: 22px 10px; text-align: center; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat strong { display: block; font-family: var(--serif); font-size: clamp(25px, 3vw, 38px); font-weight: 500; letter-spacing: -.05em; }
    .stat span { color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }

    .section { padding-top: clamp(78px, 9vw, 130px); }
    .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
    .section-heading h2 { max-width: 560px; margin: 12px 0 0; font-family: var(--serif); font-size: clamp(38px, 5vw, 66px); font-weight: 500; letter-spacing: -.065em; line-height: 1; }
    .section-heading p { max-width: 325px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .section-heading .text-link { white-space: nowrap; }
    .text-link { display: inline-flex; align-items: center; gap: 9px; color: var(--olive-dark); font-size: 12px; font-weight: 700; }
    .text-link::after { content: "↗"; font-size: 17px; transition: transform .2s ease; }
    .text-link:hover::after { transform: translate(3px, -3px); }
    .category-row { display: flex; gap: 9px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; }
    .category-row::-webkit-scrollbar { display: none; }
    .category-chip { flex: 0 0 auto; padding: 10px 16px; background: transparent; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; transition: .2s ease; }
    .category-chip:hover, .category-chip.active { background: var(--ink); color: var(--white); border-color: var(--ink); }

    .catalog-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 16px; }
    .product-card { position: relative; min-width: 0; cursor: pointer; }
    .product-card .image-wrap { position: relative; overflow: hidden; aspect-ratio: .79; background: var(--paper-2); border-radius: var(--radius-md); }
    .product-card .image-wrap::after { position: absolute; content: ""; inset: 0; border: 1px solid rgba(21, 22, 22, .07); border-radius: inherit; pointer-events: none; }
    .product-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .55s cubic-bezier(.2, .7, .2, 1); }
    .product-card:hover img { transform: scale(1.045); }
    .product-card .quick-add { position: absolute; z-index: 1; right: 12px; bottom: 12px; display: grid; place-items: center; width: 38px; height: 38px; background: rgba(255, 254, 250, .95); border-radius: 50%; opacity: 0; transform: translateY(8px); transition: .22s ease; box-shadow: 0 7px 17px rgba(0,0,0,.12); }
    .product-card:hover .quick-add, .product-card:focus-within .quick-add { opacity: 1; transform: none; }
    .product-card .badge { position: absolute; z-index: 1; top: 12px; left: 12px; padding: 6px 9px; background: var(--white); border-radius: 999px; color: var(--ink); font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .product-card .badge.sale { background: var(--rust); color: var(--white); }
    .product-info { padding: 13px 2px 0; }
    .product-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .product-info h3 { margin: 7px 0 5px; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
    .product-description { display: -webkit-box; overflow: hidden; color: var(--muted); font-size: 12px; line-height: 1.5; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .price-line { display: flex; gap: 8px; align-items: baseline; margin-top: 8px; font-size: 13px; font-weight: 700; }
    .compare-price { color: var(--muted); font-size: 11px; font-weight: 400; text-decoration: line-through; }

    .editorial { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(280px, .95fr); gap: clamp(28px, 6vw, 96px); align-items: center; margin-top: clamp(80px, 12vw, 170px); padding: clamp(28px, 5vw, 62px); background: var(--olive); color: var(--white); border-radius: var(--radius-lg); overflow: hidden; }
    .editorial-copy .eyebrow { color: var(--sage); }
    .editorial h2 { max-width: 610px; margin: 19px 0; font-family: var(--serif); font-size: clamp(37px, 4.8vw, 64px); font-weight: 500; letter-spacing: -.065em; line-height: 1; }
    .editorial p { max-width: 430px; color: rgba(255, 254, 250, .72); line-height: 1.75; }
    .editorial .secondary-button { margin-top: 17px; border-color: rgba(255,255,255,.35); color: var(--white); }
    .editorial .secondary-button:hover { border-color: var(--white); }
    .editorial-art { position: relative; min-height: 300px; }
    .editorial-art::before { position: absolute; content: ""; inset: 3% 10% 3% 10%; border: 1px solid rgba(255,255,255,.28); border-radius: 48% 52% 43% 57%; transform: rotate(-19deg); }
    .editorial-art img { position: absolute; width: 68%; height: 94%; right: 13%; top: 4%; object-fit: cover; border-radius: 47% 47% 9px 9px; transform: rotate(7deg); }
    .editorial-art .stamp { position: absolute; left: 5%; bottom: 9%; display: grid; place-items: center; width: 86px; height: 86px; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; color: var(--sage); font-family: var(--serif); font-size: 13px; text-align: center; transform: rotate(-13deg); }

    .site-footer { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 30px; margin-top: 110px; padding: 38px 0 0; border-top: 1px solid var(--line); }
    .footer-brand { max-width: 220px; }
    .footer-brand p, .footer-col a, .footer-col p { color: var(--muted); font-size: 12px; line-height: 1.8; }
    .footer-brand p { margin: 16px 0 0; }
    .footer-col h4 { margin: 0 0 13px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .footer-col a { display: block; transition: color .2s; }
    .footer-col a:hover { color: var(--ink); }
    .footer-bottom { display: flex; justify-content: space-between; gap: 16px; padding: 38px 0 0; color: var(--muted); font-size: 11px; }

    .drawer-backdrop, .modal-backdrop { position: fixed; z-index: 40; inset: 0; display: grid; visibility: hidden; background: rgba(21, 22, 22, .32); opacity: 0; transition: visibility .25s, opacity .25s; }
    .drawer-backdrop.open, .modal-backdrop.open { visibility: visible; opacity: 1; }
    .cart-drawer { align-self: stretch; justify-self: end; display: flex; flex-direction: column; width: min(470px, 100%); padding: 26px; background: var(--paper); transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.7,.2,1); }
    .drawer-backdrop.open .cart-drawer { transform: none; }
    .drawer-head, .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .drawer-head h2, .modal-head h2 { margin: 0; font-family: var(--serif); font-size: 31px; font-weight: 500; letter-spacing: -.05em; line-height: 1; }
    .close-button { display: grid; place-items: center; width: 34px; height: 34px; background: transparent; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); font-size: 20px; line-height: 1; }
    .close-button:hover { border-color: var(--ink); }
    .drawer-items { flex: 1; overflow-y: auto; margin: 25px -5px 18px 0; padding-right: 5px; }
    .empty-state { display: grid; place-items: center; min-height: 260px; padding: 30px; text-align: center; color: var(--muted); }
    .empty-state strong { display: block; margin-bottom: 8px; color: var(--ink); font-family: var(--serif); font-size: 25px; font-weight: 500; }
    .cart-item { display: grid; grid-template-columns: 66px 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .cart-item img { width: 66px; height: 82px; object-fit: cover; border-radius: 10px; }
    .cart-item h4 { margin: 0 0 4px; font-size: 13px; }
    .cart-item p { margin: 0; color: var(--muted); font-size: 11px; }
    .qty-control { display: inline-flex; align-items: center; gap: 10px; margin-top: 9px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; }
    .qty-control button { display: grid; place-items: center; width: 19px; height: 19px; background: transparent; color: var(--ink); border-radius: 50%; }
    .qty-control button:hover { background: var(--paper-2); }
    .cart-item-total { align-self: start; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .remove-item { display: block; margin-top: 4px; padding: 0; background: transparent; color: var(--muted); font-size: 10px; text-decoration: underline; }
    .cart-summary { padding-top: 18px; border-top: 1px solid var(--ink); }
    .summary-row { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 9px; font-size: 13px; }
    .summary-row.muted { color: var(--muted); font-size: 11px; }
    .summary-row.total { margin-top: 15px; font-size: 18px; font-weight: 700; }
    .full-button { width: 100%; margin-top: 15px; }

    .modal-backdrop { place-items: center; padding: 18px; }
    .modal { width: min(760px, 100%); max-height: min(800px, calc(100vh - 36px)); overflow: auto; padding: clamp(22px, 4vw, 38px); background: var(--paper); border-radius: var(--radius-lg); box-shadow: 0 26px 80px rgba(0,0,0,.22); transform: translateY(15px) scale(.98); transition: transform .25s ease; }
    .modal-backdrop.open .modal { transform: none; }
    .product-modal { display: grid; grid-template-columns: minmax(220px, .86fr) minmax(0, 1.14fr); gap: clamp(23px, 4vw, 44px); }
    .product-modal-image { min-height: 450px; overflow: hidden; border-radius: 20px; background: var(--paper-2); }
    .product-modal-image img { width: 100%; height: 100%; min-height: 450px; object-fit: cover; }
    .product-modal-content { display: flex; flex-direction: column; }
    .product-modal-content h2 { margin: 12px 0 7px; font-family: var(--serif); font-size: clamp(35px, 4.5vw, 55px); font-weight: 500; letter-spacing: -.06em; line-height: .96; }
    .product-modal-content .large-price { margin: 12px 0 19px; font-size: 21px; font-weight: 700; }
    .product-modal-content > p { color: var(--muted); line-height: 1.75; }
    .detail-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; margin: 20px 0; border-top: 1px solid var(--line); }
    .detail-list div { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .detail-list dt { color: var(--muted); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; }
    .detail-list dd { margin: 3px 0 0; font-size: 12px; font-weight: 600; }
    .option-label { margin: 3px 0 8px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .option-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
    .option-button { min-width: 38px; height: 36px; padding: 0 12px; background: transparent; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); font-size: 11px; }
    .option-button.selected { border-color: var(--ink); background: var(--ink); color: var(--white); }

    .checkout-layout { display: grid; grid-template-columns: 1fr .85fr; gap: 35px; margin-top: 29px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: grid; gap: 6px; margin-bottom: 13px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .field input, .field select, .field textarea, .admin-search, .admin-select { width: 100%; min-height: 44px; padding: 10px 12px; background: var(--white); border: 1px solid var(--line); border-radius: 9px; color: var(--ink); outline: none; }
    .field textarea { min-height: 80px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus, .admin-search:focus { border-color: var(--olive); box-shadow: 0 0 0 3px rgba(96,107,78,.13); }
    .checkout-summary { align-self: start; padding: 20px; background: var(--paper-2); border-radius: 16px; }
    .checkout-summary h3 { margin: 0 0 16px; font-family: var(--serif); font-size: 23px; font-weight: 500; }
    .checkout-product { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .checkout-product span:first-child { color: var(--muted); }
    .success-state { padding: 50px 15px; text-align: center; }
    .success-icon { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 16px; background: var(--olive); color: var(--white); border-radius: 50%; font-size: 23px; }
    .success-state h2 { margin: 0 0 10px; font-family: var(--serif); font-size: 41px; font-weight: 500; letter-spacing: -.06em; }
    .success-state p { max-width: 390px; margin: 0 auto 22px; color: var(--muted); }

    .admin-page { padding: clamp(40px, 6vw, 80px) 0 90px; }
    .admin-top { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; margin-bottom: 35px; }
    .admin-top h1 { margin: 11px 0 9px; font-family: var(--serif); font-size: clamp(42px, 6vw, 72px); font-weight: 500; letter-spacing: -.07em; line-height: .95; }
    .admin-top p { max-width: 510px; margin: 0; color: var(--muted); }
    .admin-mode { display: inline-flex; align-items: center; gap: 7px; padding: 9px 11px; background: var(--sage); border-radius: 999px; color: var(--olive-dark); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
    .admin-mode::before { content: ""; width: 7px; height: 7px; background: #709151; border-radius: 50%; box-shadow: 0 0 0 4px rgba(112,145,81,.13); }
    .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 32px; }
    .metric-card { padding: 18px; background: var(--white); border: 1px solid var(--line); border-radius: 15px; }
    .metric-card span { display: block; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .metric-card strong { display: block; margin-top: 12px; font-family: var(--serif); font-size: 31px; font-weight: 500; letter-spacing: -.05em; }
    .metric-card small { color: var(--olive-dark); font-size: 11px; }
    .admin-workspace { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }

    .toast { position: fixed; z-index: 100; right: 20px; bottom: 20px; max-width: min(360px, calc(100% - 40px)); padding: 13px 16px; background: var(--ink); color: var(--white); border-radius: 10px; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(15px); pointer-events: none; transition: .25s ease; }
    .toast.show { opacity: 1; transform: none; }
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn .5s both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      .brand-mark { width: 33px; height: 33px; font-size: 11px; }

      .hero-image-main { width: 63%; right: 9%; }
      .hero-image-small { width: 37%; left: 5%; border-width: 8px; }

      .stat:nth-child(4) { border-top: 1px solid var(--line); }
      .section-heading { display: block; }

      .product-card .badge { top: 9px; left: 9px; padding: 5px 7px; font-size: 8px; }
      .product-info h3 { font-size: 13px; }
      .editorial { grid-template-columns: 1fr; gap: 10px; margin-top: 80px; padding: 30px 24px 0; }
      .editorial-art { min-height: 300px; margin: 0 -14px; }
      .editorial-art img { width: 60%; right: 18%; }
      .site-footer { grid-template-columns: 1fr 1fr; gap: 30px 20px; margin-top: 80px; }
      .footer-brand { grid-column: 1 / -1; }

      .admin-toolbar { align-items: stretch; flex-wrap: wrap; }

      .admin-product-cell strong { font-size: 10px; line-height: 1.15; }
      .admin-product-cell span { display: block; overflow: hidden; font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
      .status { gap: 3px; padding: 4px 5px; font-size: 7px; }

    @media (max-width: 430px) {
      .page { padding-left: 15px; padding-right: 15px; }

</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="cart-drawer-backdrop" class="drawer-backdrop" aria-hidden="true">

  </div>

  <script>
    const image = (id, width = 900) => `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${width}&q=86`;
    const seedProducts = [
      { id: 'aa-001', name: 'The Linen Abaya', category: 'Abayas', price: 8900, compareAt: 10500, description: 'A soft, architectural layer for slow afternoons and city evenings.', material: 'Washed linen blend', color: 'Olive smoke', sizes: ['S', 'M', 'L', 'XL'], stock: 12, status: 'Live', rating: 4.9, reviews: 38, featured: true, image: image('photo-1539109136881-3be0616acf4b'), details: 'Relaxed silhouette with a clean front, hidden side pockets and a fluid fall.' },
      { id: 'aa-002', name: 'Noor Co-ord Set', category: 'Dresses', price: 7450, compareAt: 0, description: 'Easy tailoring in a sun-washed cotton with a gentle hand feel.', material: 'Cotton poplin', color: 'Oat', sizes: ['XS', 'S', 'M', 'L'], stock: 8, status: 'Live', rating: 4.8, reviews: 21, featured: true, image: image('photo-1483985988355-763728e1935b'), details: 'A relaxed two-piece set with an elasticated waist and softly structured top.' },
      { id: 'aa-003', name: 'Nura Silk Scarf', category: 'Hijabs', price: 2950, compareAt: 0, description: 'A luminous silk square with an ink-drawn botanical border.', material: '100% silk', color: 'Terracotta bloom', sizes: ['One size'], stock: 21, status: 'Live', rating: 4.9, reviews: 54, featured: false, image: image('photo-1515886657613-9f3515b0c78f'), details: 'Lightweight, softly lustrous and finished by hand with a rolled edge.' },
      { id: 'aa-004', name: 'Sadaf Everyday Kurta', category: 'Kurtas', price: 5200, compareAt: 6100, description: 'The one you reach for on repeat: crisp, relaxed and quietly detailed.', material: 'Textured cotton', color: 'Chalk', sizes: ['S', 'M', 'L', 'XL'], stock: 4, status: 'Low stock', rating: 4.7, reviews: 17, featured: true, image: image('photo-1529139574466-a303027c1d8b'), details: 'Straight cut with tonal stitch lines, side slits and a softly curved hem.' },
      { id: 'aa-005', name: 'Kora Leather Mules', category: 'Shoes', price: 6800, compareAt: 0, description: 'A minimal slip-on in supple leather, made for long days.', material: 'Full-grain leather', color: 'Dark cocoa', sizes: ['36', '37', '38', '39', '40'], stock: 7, status: 'Live', rating: 4.6, reviews: 14, featured: false, image: image('photo-1543163521-1bf539c55dd2'), details: 'Padded insole and a low sculpted heel for considered everyday comfort.' },
      { id: 'aa-006', name: 'Mitti Carryall', category: 'Handbags', price: 11200, compareAt: 0, description: 'A generously sized soft tote that holds the shape of your day.', material: 'Vegetable-tanned leather', color: 'Clay', sizes: ['One size'], stock: 3, status: 'Low stock', rating: 4.8, reviews: 12, featured: false, image: image('photo-1584917865442-de89df76afd3'), details: 'Roomy interior, magnetic closure and a wide strap designed for the shoulder.' },
      { id: 'aa-007', name: 'Aster Cotton Dress', category: 'Dresses', price: 6350, compareAt: 0, description: 'A breezy midi with a little movement in every step.', material: 'Airy cotton voile', color: 'Pistachio', sizes: ['XS', 'S', 'M', 'L'], stock: 10, status: 'Live', rating: 4.8, reviews: 28, featured: true, image: image('photo-1496747611176-843222e1e57c'), details: 'Gathered waist, soft balloon sleeve and an easy midi length for layering.' },
      { id: 'aa-008', name: 'Dune Home Set', category: 'Bedsheets', price: 4950, compareAt: 5600, description: 'A tactile cotton set for unhurried mornings at home.', material: '200 thread-count cotton', color: 'Warm sand', sizes: ['Queen', 'King'], stock: 2, status: 'Low stock', rating: 4.7, reviews: 9, featured: false, image: image('photo-1618220179428-22790b461013'), details: 'Includes a flat sheet and two pillowcases with a hand-finished border.' }
    ];

    const categories = ['All', 'Abayas', 'Dresses', 'Hijabs', 'Kurtas', 'Shoes', 'Handbags', 'Bedsheets'];
    const state = {
      products: loadProducts(),
      cart: loadCart(),
      category: 'All',
      query: '',
      route: getRoute(),
      selectedProduct: null,
      editingProduct: null,
      adminQuery: '',
      adminStatus: 'All',
      mobileMenu: false,
      checkoutSuccess: false
    };

    function loadProducts() {
      try { return JSON.parse(localStorage.getItem('aa-fashion-products-v1')) || seedProducts; } catch { return seedProducts; }
    }
    function loadCart() {
      try { return JSON.parse(localStorage.getItem('aa-fashion-cart-v1')) || []; } catch { return []; }
    }
    function saveProducts() { localStorage.setItem('aa-fashion-products-v1', JSON.stringify(state.products)); }
    function saveCart() { localStorage.setItem('aa-fashion-cart-v1', JSON.stringify(state.cart)); }
    function getRoute() { return window.location.pathname.toLowerCase().startsWith('/admin') ? 'admin' : 'shop'; }
    function money(value) { return `Rs. ${Number(value).toLocaleString('en-PK')}`; }
    function esc(value = '') { return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' }[char])); }
    function icon(name) {
      const paths = { bag: '<path d="M6.5 8.4h11l-.7 10.1H7.2L6.5 8.4Z"/><path d="M9 8.4V6.9a3 3 0 0 1 6 0v1.5"/>', plus: '<path d="M12 5v14M5 12h14"/>', arrow: '<path d="M5 12h13M13 6l6 6-6 6"/>', search: '<circle cx="10.7" cy="10.7" r="6.1"/><path d="m16 16 4 4"/>', menu: '<path d="M4 7h16M4 12h16M4 17h16"/>', chevron: '<path d="m8 10 4 4 4-4"/>', edit: '<path d="m5 16-.8 3.8L8 19l9.4-9.4-3.2-3.2L4.8 15.8ZM13.3 7.3l3.2 3.2"/>', trash: '<path d="M5 7h14M10 11v5M14 11v5M8 7l.6-2h6.8l.6 2m-9 0 .8 13h8.4l.8-13"/>' };
      return `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${paths[name] || paths.arrow}</svg>`;
    }
    function productById(id) { return state.products.find(product => product.id === id); }
    function cartCount() { return state.cart.reduce((sum, item) => sum + item.qty, 0); }
    function cartSubtotal() { return state.cart.reduce((sum, item) => { const product = productById(item.id); return sum + (product ? product.price * item.qty : 0); }, 0); }
    function filteredProducts() {
      const query = state.query.trim().toLowerCase();
      return state.products.filter(product => (state.category === 'All' || product.category === state.category) && (!query || `${product.name} ${product.category} ${product.description}`.toLowerCase().includes(query)) && product.status !== 'Draft');
    }
    function brand() { return `<a class="brand" href="/" data-nav="shop"><span class="brand-mark">a.a</span><span class="brand-copy"><span class="brand-name">A.A Fashion</span><span class="brand-meta">Curated in Lahore</span></span></a>`; }
    function header() {
      return `<div class="top-strip">Complimentary delivery on orders over Rs. 10,000 <span aria-hidden="true">·</span> made for the everyday</div>
      <header class="site-header">${brand()}<nav class="main-nav ${state.mobileMenu ? 'open' : ''}" aria-label="Primary navigation"><a href="/" data-nav="shop" class="${state.route === 'shop' ? 'active' : ''}">Shop</a><a href="#new" data-scroll="new">New in</a><a href="#story" data-scroll="story">Our story</a><a href="/admin" data-nav="admin" class="${state.route === 'admin' ? 'active' : ''}">Admin</a></nav><div class="header-actions"><button class="icon-button mobile-menu" data-action="toggle-menu" aria-label="Open menu">${icon('menu')}</button><button class="cart-button" data-action="open-cart" aria-label="Open shopping bag">${icon('bag')} <span>Bag</span><span class="cart-count">${cartCount()}</span></button></div></header>`;
    }
    function shopView() {
      const products = filteredProducts();
      return `${header()}<main class="page">
        <section class="hero"><div class="hero-copy-block"><span class="eyebrow">The autumn edit / 01</span><h1>Quietly bold.<br><em>Entirely yours.</em></h1><p class="hero-copy">A considered collection of everyday pieces, designed with room to breathe. Soft lines, honest materials and a little bit of unexpected.</p><div class="hero-actions"><a class="primary-button" href="#new" data-scroll="new">Explore the edit ${icon('arrow')}</a><button class="secondary-button" data-action="open-admin">Manage products</button></div><div class="hero-note"><div class="mini-avatars"><span></span><span></span><span></span></div><span><strong>12k+</strong> women choosing less, better</span></div></div><div class="hero-art"><div class="hero-image-main"><img src="https://images.unsplash.com/photo-1728487235101-664d87965931?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Model wearing a neutral A.A Fashion look"></div><div class="hero-image-small"><img src="${image('photo-1496747611176-843222e1e57c', 500)}" alt="A soft olive dress from the collection"></div><div class="art-label"><b>aa</b> made to be lived in</div></div></section>
        <section class="stat-line" aria-label="Store highlights"><div class="stat"><strong>08</strong><span>signature pieces</span></div><div class="stat"><strong>4.8/5</strong><span>community rating</span></div><div class="stat"><strong>48h</strong><span>dispatch window</span></div><div class="stat"><strong>01</strong><span>small-batch studio</span></div></section>
        <section class="section" id="new"><div class="section-heading"><div><span class="eyebrow">Shop the collection</span><h2>Pieces with a point of view.</h2></div><p>Start with the essentials, then find the detail that makes them feel like yours.</p></div><div class="category-row" aria-label="Product categories">${categories.map(category => `<button class="category-chip ${state.category === category ? 'active' : ''}" data-category="${esc(category)}">${esc(category)}</button>`).join('')}</div><div class="catalog-grid" id="catalog-grid">${products.length ? products.map(productCard).join('') : `<div class="empty-state" style="grid-column:1/-1"><strong>No pieces found</strong>Try another search or category.</div>`}</div></section>
        <section class="editorial" id="story"><div class="editorial-copy"><span class="eyebrow">A note from the studio</span><h2>Wear the day<br>your way.</h2><p>We make fewer things, with better texture, proportion and purpose. Every piece is designed in Lahore and made in small batches so your wardrobe can feel personal, not prescriptive.</p><a class="secondary-button" href="#new" data-scroll="new">Meet the collection ${icon('arrow')}</a></div><div class="editorial-art"><img src="${image('photo-1490481651871-ab68de25d43d', 800)}" alt="Editorial portrait from the A.A Fashion studio"><span class="stamp">slow<br>by design</span></div></section>
        ${footer()}
      </main>`;
    }
    function productCard(product) {
      const sale = product.compareAt && product.compareAt > product.price;
      return `<article class="product-card fade-in" data-product-id="${esc(product.id)}" tabindex="0" role="button" aria-label="View ${esc(product.name)}"><div class="image-wrap"><img src="${esc(product.image)}" alt="${esc(product.name)}"><span class="badge ${sale ? 'sale' : ''}">${sale ? 'Edit price' : product.featured ? 'Featured' : product.category}</span><button class="quick-add" data-action="quick-add" data-id="${esc(product.id)}" aria-label="Add ${esc(product.name)} to bag">${icon('plus')}</button></div><div class="product-info"><div class="product-meta"><span>${esc(product.category)}</span><span>${product.rating} ★</span></div><h3>${esc(product.name)}</h3><p class="product-description">${esc(product.description)}</p><div class="price-line"><span>${money(product.price)}</span>${sale ? `<span class="compare-price">${money(product.compareAt)}</span>` : ''}</div></div></article>`;
    }
    function footer() { return `<footer class="site-footer"><div class="footer-brand">${brand()}<p>Small-batch clothing and objects for the everyday, considered.</p></div><div class="footer-col"><h4>Explore</h4><a href="#new" data-scroll="new">New in</a><a href="#new" data-scroll="new">Best sellers</a><a href="#story" data-scroll="story">Our story</a></div><div class="footer-col"><h4>Care</h4><a href="#">Shipping & returns</a><a href="#">Size guide</a><a href="#">Care notes</a></div><div class="footer-col"><h4>Say hello</h4><a href="mailto:hello@aafashion.pk">hello@aafashion.pk</a><a href="https://instagram.com" target="_blank" rel="noreferrer">@a.a.fashion</a><p>Lahore, Pakistan</p></div><div class="footer-bottom"><span>© 2026 A.A Fashion Studio</span><span>Built for everyday ease.</span></div></footer>`; }

    function adminView() {
      const list = state.products.filter(product => (!state.adminQuery || `${product.name} ${product.category} ${product.description}`.toLowerCase().includes(state.adminQuery.toLowerCase())) && (state.adminStatus === 'All' || product.status === state.adminStatus));
      const lowStock = state.products.filter(product => product.stock <= 4);
      const inventoryValue = state.products.reduce((sum, product) => sum + (product.price * product.stock), 0);
      return `${header()}<main class="page admin-page"><div class="admin-top"><div><span class="eyebrow">A.A Fashion / workspace</span><h1>Product<br>control room.</h1><p>A clear view of what is live, what needs attention and what your customers are browsing next.</p></div><div><span class="admin-mode">Local demo workspace</span></div></div><section class="metric-grid"><div class="metric-card"><span>Total products</span><strong>${state.products.length}</strong><small>Across ${new Set(state.products.map(product => product.category)).size} categories</small></div><div class="metric-card"><span>Live products</span><strong>${state.products.filter(product => product.status === 'Live').length}</strong><small>Visible in the storefront</small></div><div class="metric-card"><span>Inventory value</span><strong>${money(inventoryValue)}</strong><small>At current retail price</small></div><div class="metric-card"><span>Needs attention</span><strong>${lowStock.length}</strong><small>${lowStock.length ? 'Low-stock products' : 'Everything is in rhythm'}</small></div></section><div class="admin-workspace"><section class="admin-panel"><div class="admin-panel-head"><div><h2>Product catalogue</h2><p>Search, edit and keep the storefront current.</p></div><button class="primary-button" data-action="add-product">${icon('plus')} Add product</button></div><div class="admin-toolbar"><input class="admin-search" type="search" placeholder="Search products, categories or descriptions" value="${esc(state.adminQuery)}" aria-label="Search products"><select class="admin-select" data-admin-status aria-label="Filter by product status"><option ${state.adminStatus === 'All' ? 'selected' : ''}>All</option><option ${state.adminStatus === 'Live' ? 'selected' : ''}>Live</option><option ${state.adminStatus === 'Low stock' ? 'selected' : ''}>Low stock</option><option ${state.adminStatus === 'Draft' ? 'selected' : ''}>Draft</option></select></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th>Details</th><th></th></tr></thead><tbody>${list.length ? list.map(adminRow).join('') : `<tr><td colspan="6"><div class="empty-state"><strong>No products match</strong>Try a different search.</div></td></tr>`}</tbody></table></div></section><aside class="insight-stack"><div class="insight-card"><h3>Low-stock radar</h3>${lowStock.length ? lowStock.map(product => `<div class="stock-row"><span>${esc(product.name)}</span><strong>${product.stock} left</strong></div>`).join('') : '<p>No low-stock items at the moment. Nice work.</p>'}</div><div class="admin-tip"><h3>Quick note</h3><p>Changes made here are saved in this browser and appear in the storefront instantly. Connect a real database or commerce provider when you are ready to make the catalogue multi-user.</p></div></aside></div></main>`;
    }
    function adminRow(product) {
      const statusClass = product.status === 'Live' ? 'live' : product.status === 'Draft' ? 'draft' : 'low';
      return `<tr><td><div class="admin-product-cell"><img src="${esc(product.image)}" alt=""><div><strong>${esc(product.name)}</strong><span>${esc(product.category)} · ${esc(product.color)}</span></div></div></td><td><strong>${money(product.price)}</strong>${product.compareAt ? `<br><span style="color:var(--muted);font-size:10px;text-decoration:line-through">${money(product.compareAt)}</span>` : ''}</td><td>${product.stock}</td><td><span class="status ${statusClass}">${esc(product.status)}</span></td><td style="max-width:230px;color:var(--muted)">${esc(product.description)}</td><td><div class="row-actions"><button data-action="edit-product" data-id="${esc(product.id)}" aria-label="Edit ${esc(product.name)}">${icon('edit')}</button><button data-action="delete-product" data-id="${esc(product.id)}" aria-label="Delete ${esc(product.name)}">${icon('trash')}</button></div></td></tr>`;
    }

    function render() {
      state.route = getRoute();
      document.getElementById('app').innerHTML = state.route === 'admin' ? adminView() : shopView();
      if (state.route === 'admin') window.scrollTo({ top: 0, behavior: 'instant' });
    }
    function openBackdrop(id) { const el = document.getElementById(id); el.classList.add('open'); el.setAttribute('aria-hidden', 'false'); document.body.classList.add('modal-open'); }
    function closeBackdrop(id) { const el = document.getElementById(id); el.classList.remove('open'); el.setAttribute('aria-hidden', 'true'); if (![...document.querySelectorAll('.drawer-backdrop.open, .modal-backdrop.open')].length) document.body.classList.remove('modal-open'); }
    function toast(message) { const el = document.getElementById('toast'); el.textContent = message; el.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }
    function openCart() { renderCart(); openBackdrop('cart-drawer-backdrop'); }
    function renderCart() {
      const items = state.cart.map(item => ({ item, product: productById(item.id) })).filter(entry => entry.product);
      const itemsEl = document.getElementById('cart-items');
      const summaryEl = document.getElementById('cart-summary');
      itemsEl.innerHTML = items.length ? items.map(({ item, product }) => `<div class="cart-item"><img src="${esc(product.image)}" alt="${esc(product.name)}"><div><h4>${esc(product.name)}</h4><p>${money(product.price)} · ${esc(item.size || product.sizes[0])}</p><div class="qty-control"><button data-cart-action="decrease" data-id="${esc(product.id)}" aria-label="Decrease quantity">−</button><span>${item.qty}</span><button data-cart-action="increase" data-id="${esc(product.id)}" aria-label="Increase quantity">+</button></div><button class="remove-item" data-cart-action="remove" data-id="${esc(product.id)}">Remove</button></div><span class="cart-item-total">${money(product.price * item.qty)}</span></div>`).join('') : '<div class="empty-state"><div><strong>Your bag is light.</strong>Add a piece you want to live in.</div></div>';
      summaryEl.innerHTML = items.length ? `<div class="summary-row"><span>Subtotal</span><strong>${money(cartSubtotal())}</strong></div><div class="summary-row muted"><span>Delivery</span><span>${cartSubtotal() >= 10000 ? 'Complimentary' : 'Calculated at checkout'}</span></div><div class="summary-row total"><span>Total</span><span>${money(cartSubtotal())}</span></div><button class="primary-button full-button" data-action="open-checkout">Continue to checkout ${icon('arrow')}</button>` : `<button class="secondary-button full-button" data-action="close-cart">Continue shopping</button>`;
    }
    function openProduct(id) {
      const product = productById(id); if (!product) return;
      state.selectedProduct = product; let size = product.sizes[0];
      const modal = document.getElementById('product-modal');
      modal.innerHTML = `<div class="product-modal"><div class="product-modal-image"><img src="${esc(product.image)}" alt="${esc(product.name)}"></div><div class="product-modal-content"><div class="drawer-head"><span class="eyebrow">${esc(product.category)} / ${product.rating} ★</span><button class="close-button" data-action="close-product" aria-label="Close product details">×</button></div><h2>${esc(product.name)}</h2><div class="large-price">${money(product.price)} ${product.compareAt ? `<span class="compare-price">${money(product.compareAt)}</span>` : ''}</div><p>${esc(product.description)}</p><dl class="detail-list"><div><dt>Material</dt><dd>${esc(product.material)}</dd></div><div><dt>Colour</dt><dd>${esc(product.color)}</dd></div><div><dt>Availability</dt><dd>${product.stock > 0 ? `${product.stock} in studio` : 'Sold out'}</dd></div><div><dt>Reviews</dt><dd>${product.reviews} notes</dd></div></dl><span class="option-label">Choose a size</span><div class="option-row" id="size-options">${product.sizes.map((option, index) => `<button class="option-button ${index === 0 ? 'selected' : ''}" data-size="${esc(option)}">${esc(option)}</button>`).join('')}</div><button class="primary-button full-button" data-action="add-selected" data-id="${esc(product.id)}" ${product.stock <= 0 ? 'disabled' : ''}>Add to bag ${icon('bag')}</button><a class="text-link" href="#" style="margin-top:18px;justify-content:center">Read care & delivery notes</a></div></div>`;
      modal.dataset.size = size; openBackdrop('product-modal-backdrop');
    }
    function addToCart(id, size) {
      const product = productById(id); if (!product) return;
      const existing = state.cart.find(item => item.id === id && item.size === size);
      if (existing) existing.qty = Math.min(existing.qty + 1, product.stock); else state.cart.push({ id, size: size || product.sizes[0], qty: 1 });
      saveCart(); render(); toast(`${product.name} added to your bag`);
    }
    function openCheckout() {
      if (!state.cart.length) return toast('Your bag is empty');
      const modal = document.getElementById('checkout-modal'); state.checkoutSuccess = false;
      modal.innerHTML = `<div class="modal-head"><div><span class="eyebrow">Almost yours</span><h2 id="checkout-title">Checkout</h2></div><button class="close-button" data-action="close-checkout" aria-label="Close checkout">×</button></div><div class="checkout-layout"><form id="checkout-form"><div class="form-grid"><div class="field"><label for="checkout-name">Full name</label><input id="checkout-name" name="name" required placeholder="Your name"></div><div class="field"><label for="checkout-phone">Phone number</label><input id="checkout-phone" name="phone" required placeholder="03xx xxx xxxx"></div><div class="field full"><label for="checkout-email">Email address</label><input id="checkout-email" type="email" name="email" required placeholder="you@example.com"></div><div class="field full"><label for="checkout-address">Delivery address</label><textarea id="checkout-address" name="address" required placeholder="House, street, city"></textarea></div></div><button class="primary-button full-button" type="submit">Place demo order ${icon('arrow')}</button><p style="color:var(--muted);font-size:10px;text-align:center;margin:12px 0 0">This prototype captures the order intent; connect your payment provider for live checkout.</p></form><div class="checkout-summary"><h3>Order summary</h3>${state.cart.map(item => { const product = productById(item.id); return `<div class="checkout-product"><span>${esc(product.name)} × ${item.qty}</span><strong>${money(product.price * item.qty)}</strong></div>`; }).join('')}<div class="summary-row total"><span>Total</span><span>${money(cartSubtotal())}</span></div></div></div>`;
      openBackdrop('checkout-modal-backdrop');
    }
    function openAdminForm(product = null) {
      state.editingProduct = product; const isEdit = Boolean(product); const modal = document.getElementById('admin-modal');
      const p = product || { name: '', category: 'Dresses', price: '', compareAt: '', description: '', material: '', color: '', sizes: ['S', 'M', 'L'], stock: 10, status: 'Live', image: image('photo-1483985988355-763728e1935b'), details: '', featured: false };
      modal.innerHTML = `<div class="modal-head"><div><span class="eyebrow">Catalogue / ${isEdit ? 'edit product' : 'new product'}</span><h2 id="admin-modal-title">${isEdit ? 'Refine a piece.' : 'Add a new piece.'}</h2></div><button class="close-button" data-action="close-admin-modal" aria-label="Close product form">×</button></div><form id="admin-form" style="margin-top:28px"><div class="form-grid"><div class="field"><label for="product-name">Product name</label><input id="product-name" name="name" value="${esc(p.name)}" required></div><div class="field"><label for="product-category">Category</label><select id="product-category" name="category">${categories.filter(c => c !== 'All').map(c => `<option ${p.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div><div class="field"><label for="product-price">Price (PKR)</label><input id="product-price" name="price" type="number" min="0" value="${esc(p.price)}" required></div><div class="field"><label for="product-compare">Compare-at price</label><input id="product-compare" name="compareAt" type="number" min="0" value="${esc(p.compareAt || '')}"></div><div class="field"><label for="product-stock">Stock units</label><input id="product-stock" name="stock" type="number" min="0" value="${esc(p.stock)}" required></div><div class="field"><label for="product-status">Status</label><select id="product-status" name="status"><option ${p.status === 'Live' ? 'selected' : ''}>Live</option><option ${p.status === 'Low stock' ? 'selected' : ''}>Low stock</option><option ${p.status === 'Draft' ? 'selected' : ''}>Draft</option></select></div><div class="field"><label for="product-material">Material</label><input id="product-material" name="material" value="${esc(p.material)}" placeholder="Cotton poplin"></div><div class="field"><label for="product-color">Colour</label><input id="product-color" name="color" value="${esc(p.color)}" placeholder="Oat"></div><div class="field full"><label for="product-image">Image URL</label><input id="product-image" name="image" value="${esc(p.image)}" required></div><div class="field full"><label for="product-description">Short description</label><textarea id="product-description" name="description" required>${esc(p.description)}</textarea></div><div class="field full"><label for="product-details">Product details</label><textarea id="product-details" name="details">${esc(p.details)}</textarea></div><div class="field full"><label for="product-sizes">Sizes (comma separated)</label><input id="product-sizes" name="sizes" value="${esc(p.sizes.join(', '))}" placeholder="S, M, L"></div></div><button class="primary-button full-button" type="submit">${isEdit ? 'Save changes' : 'Add product'} ${icon('arrow')}</button></form>`;
      openBackdrop('admin-modal-backdrop');
    }

    document.addEventListener('click', event => {
      const nav = event.target.closest('[data-nav]');
      if (nav) { event.preventDefault(); window.history.pushState({}, '', nav.getAttribute('href')); state.mobileMenu = false; render(); return; }
      const scroll = event.target.closest('[data-scroll]');
      if (scroll) { event.preventDefault(); state.mobileMenu = false; if (state.route !== 'shop') { window.history.pushState({}, '', '/'); render(); } setTimeout(() => document.getElementById(scroll.dataset.scroll)?.scrollIntoView({ behavior: 'smooth' }), 20); return; }
      const category = event.target.closest('[data-category]'); if (category) { state.category = category.dataset.category; render(); document.getElementById('new')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      const card = event.target.closest('.product-card'); if (card && !event.target.closest('button')) { openProduct(card.dataset.productId); return; }
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action === 'toggle-menu') { state.mobileMenu = !state.mobileMenu; render(); }
      if (action === 'open-cart') openCart();
      if (action === 'close-cart') closeBackdrop('cart-drawer-backdrop');
      if (action === 'open-admin') { window.history.pushState({}, '', '/admin'); render(); }
      if (action === 'quick-add') { event.stopPropagation(); addToCart(event.target.closest('[data-id]').dataset.id); }
      if (action === 'close-product') closeBackdrop('product-modal-backdrop');
      if (action === 'add-selected') { const modal = document.getElementById('product-modal'); addToCart(event.target.closest('[data-id]').dataset.id, modal.dataset.size); closeBackdrop('product-modal-backdrop'); openCart(); }
      if (action === 'open-checkout') openCheckout();
      if (action === 'close-checkout') closeBackdrop('checkout-modal-backdrop');
      if (action === 'add-product') openAdminForm();
      if (action === 'edit-product') openAdminForm(productById(event.target.closest('[data-id]').dataset.id));
      if (action === 'delete-product') { const id = event.target.closest('[data-id]').dataset.id; const product = productById(id); if (product && confirm(`Remove ${product.name} from the catalogue?`)) { state.products = state.products.filter(item => item.id !== id); saveProducts(); render(); toast('Product removed from the catalogue'); } }
      if (action === 'close-admin-modal') closeBackdrop('admin-modal-backdrop');
      const cartAction = event.target.closest('[data-cart-action]');
      if (cartAction) { const id = cartAction.dataset.id; const item = state.cart.find(entry => entry.id === id); if (!item) return; if (cartAction.dataset.cartAction === 'increase') item.qty = Math.min(item.qty + 1, productById(id).stock); if (cartAction.dataset.cartAction === 'decrease') item.qty -= 1; if (cartAction.dataset.cartAction === 'remove' || item.qty <= 0) state.cart = state.cart.filter(entry => entry !== item); saveCart(); render(); openCart(); }
      const size = event.target.closest('[data-size]'); if (size) { document.querySelectorAll('[data-size]').forEach(button => button.classList.remove('selected')); size.classList.add('selected'); document.getElementById('product-modal').dataset.size = size.dataset.size; }
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') ['cart-drawer-backdrop', 'product-modal-backdrop', 'checkout-modal-backdrop', 'admin-modal-backdrop'].forEach(closeBackdrop); if (event.key === 'Enter' && event.target.closest('.product-card')) openProduct(event.target.closest('.product-card').dataset.productId); });
    document.addEventListener('input', event => { if (event.target.classList.contains('admin-search')) { state.adminQuery = event.target.value; render(); const search = document.querySelector('.admin-search'); search?.focus(); search?.setSelectionRange(search.value.length, search.value.length); } });
    document.addEventListener('change', event => { if (event.target.matches('[data-admin-status]')) { state.adminStatus = event.target.value; render(); } });
    document.addEventListener('submit', event => {
      if (event.target.id === 'checkout-form') { event.preventDefault(); state.cart = []; saveCart(); document.getElementById('checkout-modal').innerHTML = `<div class="success-state"><div class="success-icon">✓</div><h2>Order intent received.</h2><p>Thank you — this demo has captured your details locally. Connect a payment provider to turn this into a live checkout.</p><button class="primary-button" data-action="close-checkout">Back to the edit</button></div>`; render(); }
      if (event.target.id === 'admin-form') { event.preventDefault(); const form = new FormData(event.target); const stock = Number(form.get('stock') || 0); const product = { id: state.editingProduct?.id || `aa-${Date.now()}`, name: form.get('name'), category: form.get('category'), price: Number(form.get('price') || 0), compareAt: Number(form.get('compareAt') || 0), description: form.get('description'), material: form.get('material'), color: form.get('color'), sizes: String(form.get('sizes')).split(',').map(value => value.trim()).filter(Boolean), stock, status: stock <= 4 && form.get('status') === 'Live' ? 'Low stock' : form.get('status'), rating: state.editingProduct?.rating || 5, reviews: state.editingProduct?.reviews || 0, featured: state.editingProduct?.featured || false, image: form.get('image'), details: form.get('details') }; if (state.editingProduct) state.products = state.products.map(item => item.id === product.id ? product : item); else state.products.unshift(product); saveProducts(); closeBackdrop('admin-modal-backdrop'); render(); toast(state.editingProduct ? 'Product updated' : 'Product added to the catalogue'); }
    });
    document.getElementById('product-modal-backdrop').addEventListener('click', event => { if (event.target === event.currentTarget) closeBackdrop('product-modal-backdrop'); });
    document.getElementById('checkout-modal-backdrop').addEventListener('click', event => { if (event.target === event.currentTarget) closeBackdrop('checkout-modal-backdrop'); });
    document.getElementById('admin-modal-backdrop').addEventListener('click', event => { if (event.target === event.currentTarget) closeBackdrop('admin-modal-backdrop'); });
    document.getElementById('cart-drawer-backdrop').addEventListener('click', event => { if (event.target === event.currentTarget) closeBackdrop('cart-drawer-backdrop'); });
    window.addEventListener('popstate', () => { state.mobileMenu = false; render(); });
    render();
  </script>
</body>
</html>
